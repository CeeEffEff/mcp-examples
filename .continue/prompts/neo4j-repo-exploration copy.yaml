name: Repo Exploration Plan OLD
version: 0.0.1
schema: v1
prompts:
  - name: Repo Exploration Plan OLD
    description: General methodology for analyzing a codebase
    prompt: |
      # **Repo Exploration Plan**  
      *(General methodology for analyzing a codebase)*

      ---

      ## **1. Initial Setup & Tooling**  
      - **Use read-only tools**:  
        - `file_glob_search` to identify key file types (e.g., `*.py`, `*.js`).  
        - `ls` to list directories and assess structure.  
        - `grep_search` to find patterns (e.g., API endpoints, database connections).  
      - **Knowledge graph**: Use `neo4j_memory_read_graph` to map entities and relations (e.g., "Server → API → Database").  

      ---

      ## **2. File Classification**  
      - **Categorize files** by role:  
        - **Server logic**: Files with main entry points (e.g., `main.py`, `server.js`).  
        - **Utilities**: Helper functions (e.g., `utils.py`, `helpers.js`).  
        - **Agents/Workflows**: Code with task queues, rules, or state management (e.g., `multi_agent.py`, `rule_improvement.py`).  
        - **Tools/Utilities**: Code for search, code blocks, or versioning (e.g., `grepSearch.py`, `original.py`).  

      ---

      ## **3. Entity & Observation Identification**  
      - **Entities**:  
        - APIs, databases, configuration files, memory systems, rule engines.  
        - Example: "Agent Memory" (entity) → "Stores task-specific code blocks" (observation).  
      - **Observations**:  
        - Code patterns (e.g., "UUID-based file naming for task isolation").  
        - Dependencies (e.g., "Server depends on `dynamic_evaluation.py` for metrics").  
        - Loops/Iterations: Identify repetitive tasks (e.g., "Memory callbacks in `memory_step.py`").  

      ---

      ## **4. Iterative Analysis**  
      - **Prioritize**:  
        - Core server logic (e.g., `main.py`).  
        - Memory/agent systems (e.g., `agent_code_blocks/`, `callbacks/`).  
        - Tools for code search/versioning (e.g., `grepSearch.py`, `original.py`).  
      - **Loop detection**:  
        - Use `grep_search` to find patterns like `for`, `while`, or `async/await`.  
        - Map dependencies between entities (e.g., "Agent Memory → Rule Engine").  

      ---

      ## **5. Documentation & Knowledge Graph**  
      - **Document entities**:  
        - Use `neo4j_memory_create_entities` to add nodes (e.g., "Agent Memory", "Rule Engine").  
      - **Add observations**:  
        - Use `neo4j_memory_add_observations` to note patterns (e.g., "UUID-based code blocks for task isolation").  
      - **Map relations**:  
        - Use `neo4j_memory_create_relations` to show connections (e.g., "Agent Memory → Rule Engine").  

      ---

      ## **6. Next Steps**  
      1. **Validate loops/iterations**: Use `grep_search` for keywords like `loop`, `async`, or `queue`.  
      2. **Refine knowledge graph**: Add entities like "Database Schema" or "API Endpoints".  
      3. **Plan modifications**: If switching to Agent mode, suggest changes (e.g., optimizing memory callbacks).  

      ---

      **Note**: This plan assumes read-only access. For write operations (e.g., modifying code), switch to **Agent mode**.